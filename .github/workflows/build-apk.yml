name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Shabakti.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shabakti-apk
          path: Shabakti.apk

      # Publishes the APK as a direct download on the repo's Releases page (handy from a phone).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: شبكتي - نسخة ${{ github.run_number }}
          files: Shabakti.apk
          make_latest: true
